          "position": 3,

        },
        {
          "@type": "HowToStep",

    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a personal color season?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your personal color season describes which colors harmonise with your skin undertone, hair and eyes. ATELIER HUE analyses your photo and returns a 12-type label such as Autumn Warm Mute, plus 30 colors that flatter you and 10 to avoid."
          }
        },
        {
          "@type": "Question",
          "name": "Is the first analysis really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your first analysis, including your color season and one AI-styled look on your own photo, is free with no card required."
          }
        },
        {
          "@type": "Question",
          "name": "How does the daily outfit subscription work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each morning at 7am local time you receive an email with an outfit matched to your city's forecast, rendered on your own photo. It learns from your feedback and can build looks around clothes you already own. $6.99 per month with the first 7 days free."
          }
        },
        {
          "@type": "Question",
          "name": "What are the seasonal collections?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every season we curate two reference collections — Atelier for elevated quiet-luxury looks and Essentials for contemporary everyday pieces. Your recommendations are styled from the current season's collection."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my photo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your photo is used to generate your styling results. Subscribers' profile photos are stored securely so daily looks can be rendered; you can update or remove them at any time from your dashboard."
          }
        }
      ]
    }
    </script>
