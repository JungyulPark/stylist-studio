name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + functions)
        run: npx tsc -b && npx tsc -p functions --noEmit

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (main only)
        if: github.ref == 'refs/heads/main'
        run: npx vite build
